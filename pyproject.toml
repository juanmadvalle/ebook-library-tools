[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-library-tools"
version = "0.2.0"
description = "Preview and organize EPUB libraries with verified, recoverable moves"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ebook-organizer = "ebook_library_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
